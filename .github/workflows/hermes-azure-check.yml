name: hermes-azure-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_live:
        description: Run the live Azure Foundry verification
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  offline:
    name: Offline Worker checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build without provider credentials
        run: npm run build

  live:
    name: Live Azure Foundry verification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Azure Foundry endpoint
        env:
          AZURE_FOUNDRY_API_KEY: ${{ secrets.AZURE_FOUNDRY_API_KEY }}
          AZURE_FOUNDRY_BASE_URL: ${{ secrets.AZURE_FOUNDRY_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${AZURE_FOUNDRY_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::AZURE_FOUNDRY_API_KEY is required when run_live is true"
            exit 1
          fi
          base_url="${AZURE_FOUNDRY_BASE_URL%/}"
          if [[ ! "$base_url" =~ ^https://[^/[:space:]]+(/[^[:space:]]*)?$ ]]; then
            echo "::error::AZURE_FOUNDRY_BASE_URL must be an HTTPS URL"
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          if ! http_code="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --connect-timeout 10 \
            --max-time 30 \
            --header "api-key: $AZURE_FOUNDRY_API_KEY" \
            --header 'Content-Type: application/json' \
            --data '{"model":"gpt-5.6-sol","messages":[{"role":"user","content":"ping"}],"max_completion_tokens":16}' \
            "$base_url/chat/completions")"; then
            echo "::error::Azure Foundry request failed before receiving an HTTP response"
            exit 1
          fi

          if [[ "$http_code" != "200" ]]; then
            echo "::error::Azure Foundry returned HTTP $http_code; verify the endpoint and credentials"
            exit 1
          fi
          echo "Azure Foundry verification succeeded (HTTP 200)"
